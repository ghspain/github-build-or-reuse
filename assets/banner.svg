<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Build or Reuse</title>
  <desc id="desc">Search before you build. Discover open-source projects, verify them, and decide whether to use, contribute, fork, or build.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
    <text x="70" y="96" fill="#8b949e" font-size="25" font-weight="600" letter-spacing="2">GHSPAIN · AGENT SKILL</text>
    <text x="70" y="164" fill="#f0f6fc" font-size="56" font-weight="800">GitHub Build or Reuse</text>
    <text x="70" y="215" fill="#c9d1d9" font-size="29">Search before you build.</text>
    <text x="70" y="254" fill="#8b949e" font-size="22">Find serious open-source candidates · verify fit and risk · choose one path</text>

    <g filter="url(#shadow)" font-size="24" font-weight="750" text-anchor="middle">
      <rect x="70" y="305" width="210" height="70" rx="16" fill="#1f6feb"/>
      <text x="175" y="349" fill="#ffffff">USE</text>
      <rect x="300" y="305" width="210" height="70" rx="16" fill="#238636"/>
      <text x="405" y="349" fill="#ffffff">CONTRIBUTE</text>
      <rect x="530" y="305" width="210" height="70" rx="16" fill="#8957e5"/>
      <text x="635" y="349" fill="#ffffff">FORK</text>
      <rect x="760" y="305" width="210" height="70" rx="16" fill="#9e6a03"/>
      <text x="865" y="349" fill="#ffffff">BUILD</text>
    </g>

    <g transform="translate(1000 72)">
      <circle cx="70" cy="70" r="64" fill="#21262d" stroke="#30363d" stroke-width="3"/>
      <circle cx="70" cy="70" r="28" fill="none" stroke="#58a6ff" stroke-width="10"/>
      <path d="M70 12v24M70 104v24M12 70h24M104 70h24M29 29l17 17M94 94l17 17M111 29L94 46M46 94l-17 17" stroke="#58a6ff" stroke-width="9" stroke-linecap="round"/>
      <circle cx="70" cy="70" r="8" fill="#f0f6fc"/>
    </g>
  </g>
</svg>
