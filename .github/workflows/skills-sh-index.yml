name: Register skill with skills.sh

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/skills-sh-index.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Install published skill through the public CLI
        shell: bash
        env:
          CI: "true"
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cd "$workdir"
          npx -y skills@latest add ghspain/github-build-or-reuse --all
          test -f .agents/skills/github-build-or-reuse/SKILL.md
          grep -q '^name: github-build-or-reuse$' .agents/skills/github-build-or-reuse/SKILL.md
          echo "skills.sh telemetry-enabled install completed successfully."
