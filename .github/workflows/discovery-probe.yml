name: Discovery probe

on:
  push:
    branches: [ci/probe-discovery]
    paths:
      - .github/workflows/discovery-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe skills.sh through public CLI
        shell: bash
        run: |
          set -euo pipefail
          npx -y skills@latest find github-build-or-reuse --owner ghspain 2>&1 | tee /tmp/skills-find.txt || true
          echo '--- skills.sh result ---'
          cat /tmp/skills-find.txt

      - name: Verify canonical skills.sh web page
        shell: bash
        run: |
          set -euo pipefail
          url='https://skills.sh/ghspain/github-build-or-reuse/github-build-or-reuse'
          status=$(curl -L -sS -o /tmp/skills-page.html -w '%{http_code}' "$url")
          echo "skills.sh page status=$status"
          test "$status" = '200'
          grep -q 'github-build-or-reuse' /tmp/skills-page.html
          grep -q 'ghspain/github-build-or-reuse' /tmp/skills-page.html
          echo "skills.sh canonical page is live: $url"

      - name: Probe native GitHub metadata write with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          description='Search GitHub before you build. Agent Skill that vets open-source alternatives and decides USE, CONTRIBUTE, FORK, or BUILD.'
          topics='["agent-skills","ai-agents","ai-coding-agents","build-vs-buy","build-vs-open-source","chatgpt","claude-code","codex","developer-tools","due-diligence","github","github-cli","github-copilot","open-source","open-source-alternatives","repository-search","reuse-before-build","skills-sh","software-architecture","software-reuse"]'

          repo_status=$(curl -sS -o /tmp/repo-write.json -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/ghspain/github-build-or-reuse \
            -d "$(jq -nc --arg description "$description" '{description:$description}')")
          echo "repository PATCH status=$repo_status"
          jq -c '{message,description}' /tmp/repo-write.json 2>/dev/null || cat /tmp/repo-write.json

          topics_status=$(curl -sS -o /tmp/topics-write.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/ghspain/github-build-or-reuse/topics \
            -d "$(jq -nc --argjson names "$topics" '{names:$names}')")
          echo "topics PUT status=$topics_status"
          jq -c '{message,names}' /tmp/topics-write.json 2>/dev/null || cat /tmp/topics-write.json

      - name: Read live public metadata
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://api.github.com/repos/ghspain/github-build-or-reuse \
            | jq '{description,topics,updated_at}'
