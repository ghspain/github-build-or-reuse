name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate repository packaging
        run: python scripts/validate.py

      - name: Validate Agent Skills specification
        run: |
          git clone --depth 1 https://github.com/agentskills/agentskills.git /tmp/agentskills
          git -C /tmp/agentskills fetch --depth 1 origin 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          git -C /tmp/agentskills checkout 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          python -m pip install /tmp/agentskills/skills-ref
          skills-ref validate skills/github-build-or-reuse

      - name: Validate with GitHub CLI skill publisher
        run: |
          gh --version
          if gh skill --help >/dev/null 2>&1; then
            gh skill publish --dry-run
          else
            echo "gh skill is not available in this runner's GitHub CLI; Agent Skills reference validation already passed."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
