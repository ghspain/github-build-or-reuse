name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install validation dependency
        run: python -m pip install 'PyYAML>=6,<7'

      - name: Validate workflow security baseline
        run: python scripts/validate-workflow-security.py

      - name: Validate immutable release tag recipe
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate-release-ruleset.py
          bash -n scripts/manage-release-ruleset.sh

      - name: Validate repository packaging
        run: python scripts/validate.py

      - name: Validate Agent Plugin and skills.sh coexistence
        run: python scripts/validate-agent-plugin.py

      - name: Validate generated cross-agent manifests
        run: python scripts/generate-distribution.py --check

      - name: Validate generated demo assets
        run: python scripts/generate_demo.py --check

      - name: Validate Agent Skills specification
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/agentskills/agentskills.git /tmp/agentskills
          git -C /tmp/agentskills fetch --depth 1 origin 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          git -C /tmp/agentskills checkout 69ef37e9424c0a7ea9dd2293b559e43ec8176379
          python -m pip install /tmp/agentskills/skills-ref
          skills-ref validate skills/github-build-or-reuse

      - name: Set up GitHub Agentic Workflows CLI
        uses: github/gh-aw/actions/setup-cli@82239c030d6a1ef6ec8b87a80a1346eeef211f8d # v0.88.4
        with:
          version: v0.88.4

      - name: Validate GitHub Agentic Workflows Agent Plugin compilation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh aw version
          gh aw compile --dir tests/fixtures/gh-aw --no-check-update
          test -f tests/fixtures/gh-aw/build-or-reuse-plugin.lock.yml
          grep -q 'ghspain/github-build-or-reuse' tests/fixtures/gh-aw/build-or-reuse-plugin.lock.yml
          grep -q '74f8cfeca5c0ed5799a0ab71be88d06fc9e2afb1' tests/fixtures/gh-aw/build-or-reuse-plugin.lock.yml
          echo 'OK: gh-aw resolved v1.2.2 to its immutable commit and compiled plugin consumption'

      - name: Validate with GitHub CLI skill publisher
        shell: bash
        run: |
          set -euo pipefail
          gh --version
          if gh skill --help >/dev/null 2>&1; then
            gh skill publish --dry-run
          else
            echo "gh skill is not available in this runner's GitHub CLI; Agent Skills reference validation already passed."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate Vercel skills CLI discovery
        env:
          DISABLE_TELEMETRY: '1'
        shell: bash
        run: |
          set -euo pipefail
          npx -y skills@latest add . --list | tee /tmp/skills-list.txt
          grep -q 'github-build-or-reuse' /tmp/skills-list.txt
          echo "OK: npx skills discovers github-build-or-reuse"

      - name: Set up Node.js for plugin CLIs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Validate GitHub Copilot CLI marketplace install
        env:
          COPILOT_HOME: ${{ runner.temp }}/copilot-home
        shell: bash
        run: |
          set -euo pipefail
          npm install --global '@github/copilot@1.0.83'
          copilot --version

          copilot plugin marketplace add .
          copilot plugin marketplace browse github-build-or-reuse 2>&1 | tee /tmp/copilot-marketplace.txt
          grep -q 'github-build-or-reuse' /tmp/copilot-marketplace.txt

          copilot plugin install github-build-or-reuse@github-build-or-reuse
          copilot plugin list 2>&1 | tee /tmp/copilot-plugins.txt
          grep -q 'github-build-or-reuse@github-build-or-reuse' /tmp/copilot-plugins.txt

          echo 'OK: Copilot CLI marketplace installed github-build-or-reuse'

      - name: Validate Codex CLI Agent Plugin marketplace install
        env:
          CODEX_HOME: ${{ runner.temp }}/codex-home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CODEX_HOME"
          npm install --global '@openai/codex@0.153.4'
          codex --version

          codex plugin marketplace add .
          codex plugin list --available --json > /tmp/codex-available.json
          cat /tmp/codex-available.json
          grep -q 'github-build-or-reuse@github-community-spain' /tmp/codex-available.json

          codex plugin add github-build-or-reuse@github-community-spain --json > /tmp/codex-install.json
          cat /tmp/codex-install.json
          codex plugin list --json > /tmp/codex-plugins.json
          cat /tmp/codex-plugins.json
          grep -q 'github-build-or-reuse@github-community-spain' /tmp/codex-plugins.json
          grep -q '"installed": true' /tmp/codex-plugins.json
          grep -q '"enabled": true' /tmp/codex-plugins.json

          echo 'OK: Codex CLI installed and enabled the portable github-build-or-reuse Agent Plugin'

      - name: Validate Claude Code plugin marketplace install
        env:
          CLAUDE_TEST_HOME: ${{ runner.temp }}/claude-home
        shell: bash
        run: |
          set -euo pipefail
          npm install --global '@anthropic-ai/claude-code@2.1.263'
          claude --version
          mkdir -p "$CLAUDE_TEST_HOME"

          HOME="$CLAUDE_TEST_HOME" claude plugin validate . --strict
          HOME="$CLAUDE_TEST_HOME" claude plugin marketplace add ./ --scope user
          HOME="$CLAUDE_TEST_HOME" claude plugin list --available --json > /tmp/claude-available.json
          cat /tmp/claude-available.json
          grep -q 'github-build-or-reuse' /tmp/claude-available.json

          HOME="$CLAUDE_TEST_HOME" claude plugin install github-build-or-reuse@github-build-or-reuse --scope user
          HOME="$CLAUDE_TEST_HOME" claude plugin list --json > /tmp/claude-plugins.json
          cat /tmp/claude-plugins.json
          grep -q 'github-build-or-reuse@github-build-or-reuse' /tmp/claude-plugins.json
          echo 'OK: Claude Code validated and installed the generated plugin marketplace adapter'

      - name: Validate Gemini CLI extension install and skill discovery
        env:
          GEMINI_TEST_HOME: ${{ runner.temp }}/gemini-home
        shell: bash
        run: |
          set -euo pipefail
          npm install --global '@google/gemini-cli@0.58.0'
          gemini --version

          mkdir -p "$GEMINI_TEST_HOME/.gemini"
          cat > "$GEMINI_TEST_HOME/.gemini/settings.json" <<'JSON'
          {
            "security": {
              "folderTrust": {
                "enabled": false
              }
            }
          }
          JSON

          EXTENSION_ROOT="$(pwd)"
          HOME="$GEMINI_TEST_HOME" timeout 120s gemini extensions validate "$EXTENSION_ROOT"
          HOME="$GEMINI_TEST_HOME" timeout 120s gemini extensions install "$EXTENSION_ROOT" --consent --skip-settings
          HOME="$GEMINI_TEST_HOME" timeout 120s gemini extensions list 2>&1 | tee /tmp/gemini-extensions.txt
          grep -q 'github-build-or-reuse' /tmp/gemini-extensions.txt

          test -f "$GEMINI_TEST_HOME/.gemini/extensions/github-build-or-reuse/skills/github-build-or-reuse/SKILL.md"
          echo 'OK: Gemini CLI installed the generated extension and retained the canonical Agent Skill'
