name: Repository config

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/repository-config.yml
      - scripts/configure-repository-settings.sh
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          with open(".github/labels.json", encoding="utf-8") as f:
              labels = json.load(f)

          for label in labels:
              subprocess.run([
                  "gh", "label", "create", label["name"],
                  "--repo", repo,
                  "--color", label["color"],
                  "--description", label["description"],
                  "--force",
              ], check=True)
          PY

  repository-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply administrative repository settings when authorized
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::REPOSITORY_ADMIN_TOKEN is not configured; skipping administrative repository settings."
            exit 0
          fi
          ./scripts/configure-repository-settings.sh "$GITHUB_REPOSITORY"
