name: Trusted Behavioral Skill Evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WAZA_NO_UPDATE_CHECK: '1'
      COPILOT_SDK_TOKEN: ${{ secrets.COPILOT_SDK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect trusted model credential
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${COPILOT_SDK_TOKEN:-}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::COPILOT_SDK_TOKEN is not configured; model-backed eval was skipped."
          fi

      - name: Install pinned Waza
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/install-waza-ci.sh "$RUNNER_TEMP/waza"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run intrinsic behavioral suite
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eval-results/transcripts
          waza run evals/github-build-or-reuse/eval.yaml \
            --output eval-results/results.json \
            --reporter junit:eval-results/junit.xml \
            --transcript-dir eval-results/transcripts

      - name: Upload behavioral evidence
        if: always() && steps.credentials.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: waza-github-build-or-reuse-${{ github.run_id }}
          path: eval-results/
          if-no-files-found: warn
          retention-days: 14
