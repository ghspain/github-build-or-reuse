name: Repository maintenance

on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/repository-maintenance.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          with open(".github/labels.json", encoding="utf-8") as f:
              labels = json.load(f)

          for label in labels:
              subprocess.run([
                  "gh", "label", "create", label["name"],
                  "--repo", repo,
                  "--color", label["color"],
                  "--description", label["description"],
                  "--force",
              ], check=True)
          PY
